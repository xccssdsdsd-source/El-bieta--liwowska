name: Apply premium polish

on:
  push:
    branches:
      - premium-polish
    paths:
      - premium.css
      - premium.js
      - .github/workflows/apply-premium-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-polish
          fetch-depth: 0

      - name: Attach premium assets
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")

          css_tag = '<link rel="stylesheet" href="premium.css">'
          js_tag = '<script src="premium.js" defer></script>'

          if css_tag not in content:
              content = content.replace("</head>", f"{css_tag}\n</head>", 1)

          if js_tag not in content:
              content = content.replace("</body>", f"{js_tag}\n</body>", 1)

          path.write_text(content, encoding="utf-8")

      - name: Commit attachment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Podepnij warstwę premium do strony"
          git push origin premium-polish
